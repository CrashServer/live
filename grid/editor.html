<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Cell Editor</title>
<style>
  :root {
    --bg: #0f0f12;
    --panel: #18181c;
    --border: #2a2a30;
    --text: #d4d4d8;
    --muted: #71717a;
    --accent: #4ade80;
    --hover: #27272a;
    --selected: #3f3f46;
    --empty: #1f1f24;
    --populated: #475569;
    --running: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    height: 100vh; overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 180px 1fr 460px; height: 100vh; }

  /* ===== left: filter sidebar ===== */
  .filter-pane {
    padding: 12px; overflow-y: auto;
    border-right: 1px solid var(--border);
    background: #131318;
    font-size: 11px;
  }
  .filter-pane h3 {
    margin: 0 0 8px 0; font-size: 11px;
    color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .filter-group { margin-bottom: 12px; }
  .filter-group > label {
    display: block; color: var(--muted); margin-bottom: 4px;
    font-size: 10px;
  }
  .filter-group select,
  .filter-group input[type=number],
  .filter-group input[type=text] {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); padding: 4px 6px;
    font: inherit; border-radius: 3px;
  }
  .filter-tempo-row { display: flex; gap: 4px; align-items: center; }
  .filter-tempo-row input { flex: 1; }
  .filter-type-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-type-row label {
    cursor: pointer; padding: 3px 8px; border-radius: 3px;
    background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); user-select: none;
  }
  .filter-type-row label.active {
    color: #0f0f12; background: var(--accent); border-color: var(--accent);
  }
  .filter-type-row input { display: none; }
  .filter-clear-btn {
    width: 100%; margin-top: 6px;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--border); padding: 4px;
    cursor: pointer; font: inherit; font-size: 10px;
    border-radius: 3px;
  }
  .filter-clear-btn:hover { color: var(--text); background: var(--hover); }
  .filter-count {
    color: var(--accent); font-weight: 600; margin-bottom: 8px;
    font-size: 10px;
  }

  /* ===== left: grid ===== */
  .grid-pane {
    padding: 12px;
    overflow: auto;
    border-right: 1px solid var(--border);
  }
  .toolbar {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px; font-size: 11px;
  }
  .toolbar input, .toolbar select, .toolbar button {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); padding: 4px 8px;
    font: inherit; border-radius: 3px;
  }
  .toolbar button { cursor: pointer; }
  .toolbar button:hover { background: var(--hover); }
  .stats { color: var(--muted); margin-left: auto; }

  /* True 2D grid: 26 cols × 100 rows.
     Each cell = 22×16 px. Width = 60 (row label) + 26*22 = 632 px. */
  .grid-wrap { display: flex; flex-direction: column; }

  /* column header: letter row + role-name row */
  .col-header-letters,
  .col-header-roles {
    display: flex; margin-left: 60px; height: 16px;
  }
  .col-header-letters span,
  .col-header-roles span {
    width: 22px; text-align: center; flex-shrink: 0;
  }
  .col-header-letters span {
    color: var(--text); font-size: 11px; font-weight: 600;
  }
  .col-header-roles span {
    color: var(--muted); font-size: 8.5px; line-height: 1.1;
    overflow: hidden;
  }
  .col-header-roles { height: 28px; margin-bottom: 4px; align-items: flex-start; }

  /* each row = one tempo row (0..99) */
  .grid-row {
    display: flex; align-items: center; height: 16px;
  }
  .row-label {
    width: 60px; color: var(--muted); font-size: 9px;
    flex-shrink: 0; text-align: right; padding-right: 6px;
    white-space: nowrap; overflow: hidden;
  }
  .grid-row.band-divider { margin-top: 4px; border-top: 1px dashed #2a2a30; }

  .cell {
    width: 22px; height: 16px;
    border: 1px solid var(--border);
    margin: 0; padding: 0;
    background: var(--empty);
    cursor: pointer;
    flex-shrink: 0;
    transition: filter 0.1s;
  }
  .cell.populated { /* background set inline per column */ }
  .cell.selected {
    outline: 1.5px solid var(--accent); outline-offset: -1px; z-index: 1;
  }
  .cell:hover { filter: brightness(1.4); }

  /* ===== right: editor ===== */
  .editor-pane {
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
    overflow: hidden;
  }
  .editor-pane h2 {
    margin: 0 0 4px 0; font-size: 14px; font-weight: 600;
    color: var(--accent);
  }
  .editor-pane h2 .coord-input {
    background: transparent; color: var(--accent);
    border: 1px dashed var(--border); padding: 2px 6px;
    width: 80px; font: inherit; font-weight: 600;
    border-radius: 3px;
  }
  .editor-pane label {
    color: var(--muted); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.05em; margin-bottom: 4px; display: block;
  }
  .editor-pane input[type=text], .editor-pane textarea {
    width: 100%; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); padding: 8px;
    font: inherit; border-radius: 3px;
    resize: none;
  }
  .editor-pane textarea {
    flex: 1; min-height: 280px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    line-height: 1.5;
  }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); padding: 7px 12px;
    cursor: pointer; font: inherit; border-radius: 3px;
    font-size: 11px;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary {
    background: var(--accent); color: #0f0f12; border-color: var(--accent);
    font-weight: 600;
  }
  .btn.primary:hover { background: #22c55e; }
  .btn.danger { color: #ef4444; }
  .btn.danger:hover { background: #450a0a; }
  .btn.play {
    background: #1e3a2e; color: #86efac; border-color: #14532d;
    min-width: 56px; text-align: center;
  }
  .btn.play:hover { background: #14532d; color: #bbf7d0; }
  .btn.play-inf {
    background: #3a2e1e; color: #fcd34d; border-color: #532d14;
  }
  .btn.play-inf:hover { background: #532d14; color: #fde68a; }
  .btn.paste {
    background: #1e2e3a; color: #93c5fd; border-color: #14304b;
  }
  .btn.paste:hover { background: #14304b; color: #bfdbfe; }

  .status { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .status.ok { color: var(--accent); }
  .status.err { color: var(--error); }

  .hint {
    background: var(--panel); padding: 8px; border-radius: 3px;
    border: 1px solid var(--border); font-size: 10px; color: var(--muted);
    line-height: 1.5;
  }
  .hint code {
    background: var(--bg); padding: 1px 4px; border-radius: 2px;
    color: var(--accent);
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ LEFT: FILTERS ============ -->
  <div class="filter-pane">
    <h3>filters</h3>
    <div class="filter-count" id="filter-count">- / -</div>

    <div class="filter-group">
      <label>type</label>
      <div class="filter-type-row" id="filter-type">
        <label data-type="atom">  <input type="checkbox" value="atom"  checked> atom</label>
        <label data-type="scene"> <input type="checkbox" value="scene" checked> scene</label>
        <label data-type="track"> <input type="checkbox" value="track" checked> track</label>
      </div>
    </div>

    <div class="filter-group">
      <label>tempo (bpm)</label>
      <div class="filter-tempo-row">
        <input type="number" id="filter-tempo-min" placeholder="min" min="40" max="220">
        <span style="color: var(--muted)">–</span>
        <input type="number" id="filter-tempo-max" placeholder="max" min="40" max="220">
      </div>
    </div>

    <div class="filter-group">
      <label>key</label>
      <select id="filter-key">
        <option value="">— any —</option>
      </select>
    </div>

    <div class="filter-group">
      <label>instrument / synth</label>
      <select id="filter-instrument">
        <option value="">— any —</option>
      </select>
    </div>

    <div class="filter-group">
      <label>source</label>
      <select id="filter-source">
        <option value="">— any —</option>
      </select>
    </div>

    <button class="filter-clear-btn" id="filter-clear-btn">clear all filters</button>
  </div>

  <!-- ============ MIDDLE: GRID ============ -->
  <div class="grid-pane">
    <div class="toolbar">
      <input type="text" id="search" placeholder="filter by label or code..." style="width:240px">
      <button id="reload-btn">reload</button>
      <span class="stats" id="stats">- / -</span>
    </div>
    <div class="col-header-letters" id="col-header-letters"></div>
    <div class="col-header-roles" id="col-header-roles"></div>
    <div class="grid-wrap" id="grid-wrap"></div>
  </div>

  <!-- ============ RIGHT: EDITOR ============ -->
  <div class="editor-pane">
    <h2>cell <input class="coord-input" id="coord-input" value="" placeholder="B32"></h2>

    <div>
      <label>label</label>
      <input type="text" id="label-input" placeholder="rolling sub-bass 120 BPM">
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
      <div>
        <label>tempo</label>
        <input type="number" id="meta-tempo" placeholder="120">
      </div>
      <div>
        <label>key</label>
        <input type="text" id="meta-key" placeholder="E minor">
      </div>
      <div>
        <label>type</label>
        <select id="meta-type" style="width:100%; background: var(--panel); color: var(--text); border: 1px solid var(--border); padding: 7px 6px; font: inherit; border-radius: 3px;">
          <option value="">—</option>
          <option value="atom">atom</option>
          <option value="scene">scene</option>
          <option value="track">track</option>
        </select>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
      <div>
        <label>instrument</label>
        <input type="text" id="meta-instrument" placeholder="dbass">
      </div>
      <div>
        <label>source</label>
        <input type="text" id="meta-source" placeholder="codeBank">
      </div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column;">
      <label>code</label>
      <textarea id="code-input" spellcheck="false" placeholder="b1 >> dbass([0, 0, -2, 0], dur=1/2, oct=4, amp=0.8)"></textarea>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="save-btn">save (Ctrl+S)</button>
      <button class="btn danger" id="delete-btn">delete</button>
    </div>
    <div class="btn-row">
      <button class="btn paste" id="paste-btn" title="paste cell code into webTroop editor without evaluating">paste</button>
      <button class="btn play" data-beats="8"  title="run for 8 beats then auto-stop">▶ 8b</button>
      <button class="btn play" data-beats="16" title="run for 16 beats then auto-stop">▶ 16b</button>
      <button class="btn play" data-beats="32" title="run for 32 beats then auto-stop">▶ 32b</button>
      <button class="btn play play-inf" data-beats="0" title="run continuously (no auto-stop)">▶ ∞</button>
    </div>
    <div class="status" id="status"></div>

    <div class="hint">
      <strong>cols:</strong> A pad B bass C kick D snare E hat F loop G/H lead I stab J acid K texture L vocal M bell N atmo<br>
      <strong>rows:</strong> 0-9=60-80 BPM, 10-19=80-100, 20-29=100-120, 30-39=120-140, 40-49=140-160, 50-59=160-180<br>
      use <code>p1</code> in column A, <code>b1</code> in B, <code>k1</code> in C, etc. so cells stack cleanly.
    </div>
  </div>
</div>

<script>
const COLS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ROWS = 200;

// Role name + color per column (per the cells.json _meta convention).
// Color is the populated-cell background; empty cells stay grey.
const ROLES = {
  A: { name: "pad",     color: "#4f6c8c" },
  B: { name: "bass",    color: "#6b4a3e" },
  C: { name: "kick",    color: "#9c3838" },
  D: { name: "snare",   color: "#a05a2c" },
  E: { name: "hat",     color: "#b8a832" },
  F: { name: "loop",    color: "#8c4838" },
  G: { name: "lead1",   color: "#3a8c8a" },
  H: { name: "lead2",   color: "#3a6b8c" },
  I: { name: "stab",    color: "#883c8c" },
  J: { name: "acid",    color: "#4a8c3a" },
  K: { name: "texture", color: "#5e5e6a" },
  L: { name: "vocal",   color: "#a04880" },
  M: { name: "bell",    color: "#5a8cb8" },
  N: { name: "atmo",    color: "#6a4a8c" },
  O: { name: "fx",      color: "#c88438" },
  P: { name: "modular", color: "#3a9c5e" },
  S: { name: "scene",   color: "#b88a3a" },
};
const DEFAULT_COLOR = "#3a3a40";
function colorForCol(col) {
  return (ROLES[col] && ROLES[col].color) || DEFAULT_COLOR;
}
function roleForCol(col) {
  return (ROLES[col] && ROLES[col].name) || "";
}

// Tempo bands per row decade. Rows 100-199 are overflow / variants /
// extended-content slots and don't map to a specific tempo.
const TEMPO_BANDS = [
  "60-80", "80-100", "100-120", "120-140",
  "140-160", "160-180", "180-200",
  "var", "var", "var",
  // rows 100-199: overflow/extended (10 more decade slots)
  "ext", "ext", "ext", "ext", "ext",
  "ext", "ext", "ext", "ext", "ext",
];

let cells = {};
let currentCoord = null;

const $ = (id) => document.getElementById(id);

async function loadCells() {
  const r = await fetch("/api/cells");
  cells = await r.json();
  Object.keys(cells).forEach(k => { if (k.startsWith("_")) delete cells[k]; });
  rebuildFilterOptions();
  renderGrid();
  updateStats();
}

function rebuildFilterOptions() {
  // Populate key/instrument/source dropdowns from the loaded cells
  const keys = new Set();
  const insts = new Set();
  const sources = new Set();
  for (const c of Object.values(cells)) {
    if (c.key && c.key.length < 30) keys.add(c.key);
    if (c.instrument) insts.add(c.instrument);
    if (c.source) sources.add(c.source);
  }
  function fill(id, vals) {
    const sel = $(id);
    const cur = sel.value;
    sel.innerHTML = '<option value="">— any —</option>';
    [...vals].sort().forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
    if ([...vals].includes(cur)) sel.value = cur;
  }
  fill("filter-key", keys);
  fill("filter-instrument", insts);
  fill("filter-source", sources);
}

function buildGrid() {
  // Column header — two rows: letter A-Z + role name underneath
  const letters = $("col-header-letters");
  const roles = $("col-header-roles");
  letters.innerHTML = "";
  roles.innerHTML = "";
  for (const col of COLS) {
    const lspan = document.createElement("span");
    lspan.textContent = col;
    lspan.style.color = colorForCol(col);
    lspan.title = roleForCol(col);
    letters.appendChild(lspan);

    const rspan = document.createElement("span");
    rspan.textContent = roleForCol(col);
    roles.appendChild(rspan);
  }

  // Body — 100 rows tall × 26 cols wide
  const wrap = $("grid-wrap");
  wrap.innerHTML = "";
  for (let row = 0; row < ROWS; row++) {
    const rowDiv = document.createElement("div");
    rowDiv.className = "grid-row";
    // Tempo band divider every 10 rows
    if (row > 0 && row % 10 === 0) rowDiv.classList.add("band-divider");

    const rowLabel = document.createElement("div");
    rowLabel.className = "row-label";
    const band = TEMPO_BANDS[Math.floor(row / 10)] || "";
    rowLabel.textContent = `${row}  ${band}`;
    rowLabel.title = `row ${row} — tempo band ${band} BPM`;
    rowDiv.appendChild(rowLabel);

    for (const col of COLS) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.coord = `${col}${row}`;
      cell.title = `${col}${row}`;
      cell.addEventListener("click", () => selectCell(cell.dataset.coord));
      rowDiv.appendChild(cell);
    }
    wrap.appendChild(rowDiv);
  }
}

function renderGrid() {
  document.querySelectorAll(".cell").forEach(el => {
    const coord = el.dataset.coord;
    const col = coord[0];
    const populated = cells[coord] != null;
    el.classList.toggle("populated", populated);
    el.classList.toggle("selected", coord === currentCoord);
    if (populated) {
      el.style.background = colorForCol(col);
      el.title = `${coord} ${roleForCol(col)} — ${cells[coord].label || ""}`;
    } else {
      el.style.background = "";
      el.title = `${coord} ${roleForCol(col)} (empty)`;
    }
  });
  applySearchFilter();
}

function applySearchFilter() {
  const q = $("search").value.trim().toLowerCase();
  const tMin = parseInt($("filter-tempo-min").value, 10);
  const tMax = parseInt($("filter-tempo-max").value, 10);
  const fKey = $("filter-key").value;
  const fInst = $("filter-instrument").value;
  const fSrc = $("filter-source").value;
  const allowedTypes = new Set(
    [...document.querySelectorAll("#filter-type input:checked")].map(i => i.value)
  );
  let matched = 0;
  document.querySelectorAll(".cell").forEach(el => {
    const coord = el.dataset.coord;
    const cell = cells[coord];
    if (!cell) {
      // empty cells: dim if any filter active
      const anyFilter = q || tMin || tMax || fKey || fInst || fSrc
                        || allowedTypes.size < 3;
      el.style.opacity = anyFilter ? "0.10" : "1";
      return;
    }
    let ok = true;
    if (q) {
      const hay = ((cell.label || "") + " " + (cell.code || "")).toLowerCase();
      if (!hay.includes(q)) ok = false;
    }
    if (ok && !isNaN(tMin) && (cell.tempo == null || cell.tempo < tMin)) ok = false;
    if (ok && !isNaN(tMax) && (cell.tempo == null || cell.tempo > tMax)) ok = false;
    if (ok && fKey && cell.key !== fKey) ok = false;
    if (ok && fInst && cell.instrument !== fInst) ok = false;
    if (ok && fSrc && cell.source !== fSrc) ok = false;
    if (ok && allowedTypes.size < 3) {
      const type = cell.type || "atom";
      if (!allowedTypes.has(type)) ok = false;
    }
    el.style.opacity = ok ? "1" : "0.18";
    if (ok) matched++;
  });
  $("filter-count").textContent = `${matched} matching / ${Object.keys(cells).length} total`;
}

function updateStats() {
  const total = Object.keys(cells).length;
  $("stats").textContent = `${total} cells / 2600 capacity`;
}

function selectCell(coord) {
  currentCoord = coord;
  $("coord-input").value = coord;
  const cell = cells[coord];
  if (cell) {
    $("label-input").value = cell.label || "";
    $("code-input").value = cell.code || "";
    $("meta-tempo").value = cell.tempo ?? "";
    $("meta-key").value = cell.key ?? "";
    $("meta-type").value = cell.type ?? "";
    $("meta-instrument").value = cell.instrument ?? "";
    $("meta-source").value = cell.source ?? "";
    setStatus(`loaded ${coord}`, "");
  } else {
    $("label-input").value = "";
    $("code-input").value = "";
    $("meta-tempo").value = "";
    $("meta-key").value = "";
    $("meta-type").value = "";
    $("meta-instrument").value = "";
    $("meta-source").value = "";
    setStatus(`new cell ${coord}`, "");
  }
  document.querySelectorAll(".cell").forEach(el => {
    el.classList.toggle("selected", el.dataset.coord === coord);
  });
}

function setStatus(msg, kind) {
  const el = $("status");
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}

async function saveCell() {
  const coord = $("coord-input").value.trim().toUpperCase();
  if (!/^[A-Z]\d{1,3}$/.test(coord)) {
    setStatus(`invalid coord '${coord}' - must be A0..Z99`, "err");
    return;
  }
  const body = {
    coord,
    code: $("code-input").value,
    label: $("label-input").value,
  };
  // Optional metadata fields — only include if non-empty
  const tempo = $("meta-tempo").value.trim();
  const key = $("meta-key").value.trim();
  const type = $("meta-type").value.trim();
  const inst = $("meta-instrument").value.trim();
  const src = $("meta-source").value.trim();
  if (tempo) body.tempo = parseInt(tempo, 10);
  if (key) body.key = key;
  if (type) body.type = type;
  if (inst) body.instrument = inst;
  if (src) body.source = src;

  const r = await fetch("/api/cells", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json();
  if (data.ok) {
    cells[coord] = {
      code: body.code, label: body.label,
      tempo: body.tempo, key: body.key, type: body.type,
      instrument: body.instrument, source: body.source,
    };
    // Strip undefined for consistency with server format
    Object.keys(cells[coord]).forEach(k => {
      if (cells[coord][k] === undefined) delete cells[coord][k];
    });
    currentCoord = coord;
    rebuildFilterOptions();
    renderGrid();
    updateStats();
    setStatus(`saved ${coord}`, "ok");
  } else {
    setStatus(`error: ${data.error || "unknown"}`, "err");
  }
}

async function deleteCell() {
  const coord = $("coord-input").value.trim().toUpperCase();
  if (!cells[coord]) { setStatus(`${coord} not populated`, ""); return; }
  if (!confirm(`delete ${coord}?`)) return;
  const r = await fetch("/api/cells", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ coord, delete: true }),
  });
  const data = await r.json();
  if (data.ok) {
    delete cells[coord];
    renderGrid();
    updateStats();
    setStatus(`deleted ${coord}`, "ok");
    $("label-input").value = "";
    $("code-input").value = "";
  } else {
    setStatus(`error: ${data.error || "unknown"}`, "err");
  }
}

// Play cell for `beats` beats (0 = continuous, no auto-stop)
async function playCell(beats) {
  const coord = $("coord-input").value.trim().toUpperCase();
  if (!/^[A-Z]\d{1,3}$/.test(coord)) {
    setStatus(`invalid coord '${coord}'`, "err");
    return;
  }
  await saveCell();
  const cmd = beats > 0
    ? `compo.cell_reload(); compo.cell_run('${coord}', ${beats})`
    : `compo.cell_reload(); compo.cell_run('${coord}')`;
  const label = beats > 0 ? `${beats}b` : "∞";

  if (window.parent !== window) {
    const acked = await new Promise((resolve) => {
      const onAck = (e) => {
        if (e.data && e.data.type === "gridTestAck" && e.data.coord === coord) {
          window.removeEventListener("message", onAck);
          resolve(true);
        }
      };
      window.addEventListener("message", onAck);
      window.parent.postMessage({ type: "gridTest", code: cmd, coord }, "*");
      setTimeout(() => {
        window.removeEventListener("message", onAck);
        resolve(false);
      }, 400);
    });
    if (acked) {
      setStatus(`fired ${coord} (${label}) via webTroop`, "ok");
      return;
    }
  }
  try {
    await navigator.clipboard.writeText(cmd);
    setStatus(`copied (${label}): ${cmd}`, "ok");
  } catch (e) {
    setStatus(`copy failed - run manually: ${cmd}`, "err");
  }
}

// Paste cell code into webTroop editor without evaluating
async function pasteCellToWebtroop() {
  const coord = $("coord-input").value.trim().toUpperCase();
  const code = $("code-input").value;
  if (!code.trim()) {
    setStatus(`cell ${coord} is empty`, "err");
    return;
  }
  // Save first so the editor reflects current text
  await saveCell();

  if (window.parent !== window) {
    const acked = await new Promise((resolve) => {
      const onAck = (e) => {
        if (e.data && e.data.type === "gridPasteAck") {
          window.removeEventListener("message", onAck);
          resolve(true);
        }
      };
      window.addEventListener("message", onAck);
      window.parent.postMessage({ type: "gridPaste", code, coord }, "*");
      setTimeout(() => {
        window.removeEventListener("message", onAck);
        resolve(false);
      }, 400);
    });
    if (acked) {
      setStatus(`pasted ${coord} into webTroop (no eval)`, "ok");
      return;
    }
  }
  try {
    await navigator.clipboard.writeText(code);
    setStatus(`copied ${coord} code to clipboard`, "ok");
  } catch (e) {
    setStatus(`copy failed`, "err");
  }
}

// ===== wire up =====
buildGrid();
loadCells();

$("save-btn").addEventListener("click", saveCell);
$("delete-btn").addEventListener("click", deleteCell);
$("paste-btn").addEventListener("click", pasteCellToWebtroop);

// Filter sidebar wiring
["filter-tempo-min", "filter-tempo-max", "filter-key", "filter-instrument",
 "filter-source"].forEach(id => {
  $(id).addEventListener("input", applySearchFilter);
  $(id).addEventListener("change", applySearchFilter);
});
document.querySelectorAll("#filter-type input").forEach(cb => {
  cb.addEventListener("change", () => {
    cb.closest("label").classList.toggle("active", cb.checked);
    applySearchFilter();
  });
  cb.closest("label").classList.toggle("active", cb.checked);
});
$("filter-clear-btn").addEventListener("click", () => {
  $("filter-tempo-min").value = "";
  $("filter-tempo-max").value = "";
  $("filter-key").value = "";
  $("filter-instrument").value = "";
  $("filter-source").value = "";
  $("search").value = "";
  document.querySelectorAll("#filter-type input").forEach(cb => {
    cb.checked = true;
    cb.closest("label").classList.add("active");
  });
  applySearchFilter();
});
document.querySelectorAll(".btn.play").forEach(btn => {
  btn.addEventListener("click", () => {
    const beats = parseInt(btn.dataset.beats, 10) || 0;
    playCell(beats);
  });
});
$("reload-btn").addEventListener("click", loadCells);
$("search").addEventListener("input", applySearchFilter);
$("coord-input").addEventListener("change", () => {
  const c = $("coord-input").value.trim().toUpperCase();
  if (/^[A-Z]\d{1,3}$/.test(c)) selectCell(c);
});

document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "s") {
    e.preventDefault();
    saveCell();
  }
});
</script>
