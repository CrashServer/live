<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrashTroop Video</title>
    <link rel="icon" href="/src/images/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="stylesheet" href="/src/css/interfaceThemes.css" />
    <link rel="stylesheet" href="/src/css/video.css" />
  </head>
  <body>
    <div id="video-container">
      <header id="video-header">
        <span id="video-title">CrashTroop Video</span>
        <span id="video-status">Waiting...</span>
      </header>
      <div id="player"></div>
      <footer id="video-footer">
        <span id="video-time">0:00 / 0:00</span>
        <span id="video-rate">1x</span>
        <span id="loop-indicator" class="hidden">LOOP</span>
      </footer>
    </div>
    <script type="module" src="/src/js/video.js"></script>
  </body>
</html>
